# RHU Queue app at /queue (PM2 process "rhu-queue" on 127.0.0.1:3080).
# The trailing slash on proxy_pass strips the /queue prefix; the app is built with BASE_PATH=/queue.
location = /queue {
	return 301 /queue/;
}

location /queue/socket.io/ {
	proxy_pass http://127.0.0.1:3080/socket.io/;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 3600s;
}

location /queue/ {
	proxy_pass http://127.0.0.1:3080/;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	# The app sees paths without /queue, so scope its session cookie to /queue here.
	proxy_cookie_path / /queue/;
	client_max_body_size 1m;
}
