# Reverb WSS front-end for the RHU Queue Laravel stack.
#
# Merge into the existing 443 server block (rhu.queue). Assumes:
#   - `php artisan reverb:start --host=127.0.0.1 --port=8080` (see reverb.service)
#   - production .env: REVERB_HOST=rhu.queue, REVERB_PORT=443, REVERB_SCHEME=https
#     so browsers connect wss://rhu.queue/app/<key> through this proxy.
#
# Diagram boxes covered here: Nginx/Reverse Proxy (WSS over TLS),
# connection limits (limit_conn), rate limiting (limit_req on the auth
# endpoint; per-message throttling also enforced by the Reverb server via
# REVERB_APP_RATE_LIMITING_ENABLED=true).

upstream reverb_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# 5 concurrent WS connections per IP (clinics behind NAT share a bucket;
# raise if a whole ward NATs to one address).
limit_conn_zone $binary_remote_addr zone=reverb_conn:10m;

# 30 auth attempts/min per IP, burst 10 (Laravel also throttles
# /broadcasting/auth at 60 r/m per IP as a second barrier).
limit_req_zone $binary_remote_addr zone=reverb_auth:10m rate=30r/m;

# --- WebSocket traffic (pusher protocol: /app/<key>) ---
location /app/ {
    limit_conn reverb_conn 5;

    proxy_pass http://reverb_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Reverb ping_interval is 60s; keep idle WS alive well past it.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# --- Channel-auth endpoint: MUST route to php-fpm like the other .php
# --- endpoints (NOT to reverb_backend). If your php location is regex-based
# --- it already matches; otherwise add an explicit block:
location = /broadcasting/auth {
    limit_req zone=reverb_auth burst=10 nodelay;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;  # match the existing php location
}
